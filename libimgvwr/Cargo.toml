[package]
name = "libimgvwr"
version = "0.1.0"
description = "Core library for the imgvwr image viewer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["png"]
png = ["image/png"]
jpeg = ["image/jpeg"]
webp = ["image/webp"]
avif = ["image/avif"]
decorations = []

[dependencies]
image = { version = "0.25", default-features = false }
