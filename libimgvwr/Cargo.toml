[package]
name = "libimgvwr"
version = "0.1.0"
description = "Core library for the imgvwr image viewer"
edition.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["png"]
png = ["image/png"]
jpeg = ["image/jpeg"]
webp = ["image/webp"]
avif = ["image/avif-native"]
jxl  = ["dep:jxl"]
decorations = []
gpu-vulkan = ["dep:wgpu", "dep:pollster", "wgpu/vulkan", "wgpu/wgsl"]
gpu-gles   = ["dep:wgpu", "dep:pollster", "wgpu/gles",   "wgpu/wgsl"]

[dependencies]
image = { version = "0.25", default-features = false }
tracing = "0.1"
memmap2 = "0.9"
rustix = { version = "1", features = ["fs"] }
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client", "unstable"] }
xkbcommon = "0.9"
wgpu = { version = "29", optional = true, default-features = false, features = ["wgsl", "vulkan", "gles"] }
pollster = { version = "0.4", optional = true }
jxl = { version = "0.4", optional = true, default-features = false }

[dev-dependencies]
tempfile = "3"
